<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Books & Products | CareerMoney365</title>
  <meta name="description" content="CareerMoney365 Books, E-books and digital products for career, earning and financial growth.">

  <link rel="stylesheet" href="assests/style.css">

  <style>
    .products-section {
      padding: 40px 0 60px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .product-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      border: 1px solid #eee;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }

    .product-image-box {
      width: 100%;
      height: 300px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-content {
      padding: 22px;
    }

    .product-category {
      display: inline-block;
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #f1f1f1;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 22px;
      margin: 5px 0 10px;
      line-height: 1.3;
    }

    .product-description {
      color: #666;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .product-price {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .buy-button {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
      background: #111;
      color: #fff;
      font-weight: 600;
      transition: opacity 0.2s ease;
      box-sizing: border-box;
    }

    .buy-button:hover {
      opacity: 0.85;
    }

    .coming-soon {
      background: #999;
      cursor: not-allowed;
    }

    .no-products {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    @media (max-width: 600px) {
      .product-image-box {
        height: 260px;
      }

      .product-title {
        font-size: 20px;
      }

      .product-price {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="nav">
    <div class="container nav-inner">

      <a href="index.html" class="brand">
        <span class="logo">CareerMoney365</span>
      </a>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="products.html">Books & Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>

    </div>
  </header>


  <!-- HERO -->
  <section class="hero">
    <div class="container">

      <div class="chip">
        CareerMoney365 Store
      </div>

      <h1>Books & Products</h1>

      <p>
        Practical books, e-books and digital products
        to help you grow your career, income and financial knowledge.
      </p>

    </div>
  </section>


  <!-- PRODUCTS -->
  <main class="container products-section">

    <div id="productsGrid" class="products-grid">
      <div class="no-products">
        Products load ho rahe hain...
      </div>
    </div>

  </main>


  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>
        © <span id="year"></span> CareerMoney365. All rights reserved.
      </p>
    </div>
  </footer>


  <!-- PRODUCT SCRIPT -->
  <script>

    document.getElementById("year").textContent =
      new Date().getFullYear();


    async function loadProducts() {

      const grid = document.getElementById("productsGrid");

      try {

        const response = await fetch("assests/products/products.json");

        if (!response.ok) {
          throw new Error("Products file not found");
        }

        const products = await response.json();

        if (!products || products.length === 0) {

          grid.innerHTML = `
            <div class="no-products">
              <h2>No products available</h2>
              <p>Products will be available soon.</p>
            </div>
          `;

          return;
        }


        grid.innerHTML = products.map(product => {

          const hasPaymentLink =
            product.paymentLink &&
            product.paymentLink !== "#";


          return `

            <article class="product-card">

              <div class="product-image-box">

                <img
                  src="${product.image}"
                  alt="${product.name}"
                  class="product-image"
                  loading="lazy"
                >

              </div>


              <div class="product-content">

                <span class="product-category">
                  ${product.category || "Digital Product"}
                </span>


                <h2 class="product-title">
                  ${product.name}
                </h2>


                <p class="product-description">
                  ${product.description}
                </p>


                <div class="product-price">
                  ₹${product.price}
                </div>


                ${
                  hasPaymentLink

                  ? `
                    <a
                      href="${product.paymentLink}"
                      class="buy-button"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Buy Now
                    </a>
                  `

                  : `
                    <span class="buy-button coming-soon">
                      Payment Coming Soon
                    </span>
                  `
                }

              </div>

            </article>

          `;

        }).join("");


      } catch (error) {

        console.error(error);

        grid.innerHTML = `

          <div class="no-products">

            <h2>Products load नहीं हो सके</h2>

            <p>
              Please try again later.
            </p>

          </div>

        `;

      }

    }


    loadProducts();

  </script>

</body>
</html>
