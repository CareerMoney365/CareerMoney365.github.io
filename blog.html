<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blog | CareerMoney365</title>

  <meta
    name="description"
    content="Career, money, earning and financial freedom articles on CareerMoney365."
  >

  <link rel="stylesheet" href="assests/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="nav">
    <div class="container nav-inner">

      <a href="index.html" class="brand">
        <span class="logo">CareerMoney365</span>
      </a>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="products.html">Books & Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>

    </div>
  </header>


  <!-- HERO -->
  <section class="hero">
    <div class="container">

      <div class="chip">
        CareerMoney365 Blog
      </div>

      <h1>Career, Money & Growth</h1>

      <p>
        Career, earning, money management and financial freedom
        से जुड़ी practical जानकारी।
      </p>

    </div>
  </section>


  <!-- SEARCH -->
  <main class="container">

    <div
      style="
        display:flex;
        gap:12px;
        flex-wrap:wrap;
        margin:30px 0;
      "
    >

      <input
        id="q"
        type="search"
        placeholder="Search articles..."
        style="
          flex:1;
          min-width:220px;
          padding:12px 15px;
          border:1px solid #ddd;
          border-radius:8px;
          font-size:16px;
        "
      >

      <select
        id="cat"
        style="
          padding:12px 15px;
          border:1px solid #ddd;
          border-radius:8px;
          font-size:16px;
        "
      >
        <option value="">All Categories</option>
      </select>

    </div>


    <!-- POSTS -->
    <div
      id="allPosts"
      class="grid"
    >
      <div class="post">
        <h2>Loading...</h2>
        <p>Articles load हो रहे हैं...</p>
      </div>
    </div>

  </main>


  <!-- FOOTER -->
  <footer class="footer">

    <div class="container">

      <p>
        © <span id="y"></span> CareerMoney365.
        All rights reserved.
      </p>

    </div>

  </footer>


  <!-- SCRIPTS -->
  <script src="assests/blog.js"></script>
  <script src="assests/script.js"></script>

  <script>
    document.getElementById("y").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
